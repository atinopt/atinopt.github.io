<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATINO — Official Website</title>
  <meta name="description" content="Official website of ATINO. The site is currently under construction." />
  <meta name="theme-color" content="#0b1020" />
  <style>
    :root{
      --bg:#070b14; --bg2:#0c1324; --line:rgba(255,255,255,.11);
      --text:#f4f7fb; --muted:#aab6c8; --cyan:#57d6ff; --violet:#9b7cff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--text);
      background:
        radial-gradient(circle at 18% 20%, rgba(87,214,255,.13), transparent 30%),
        radial-gradient(circle at 82% 22%, rgba(155,124,255,.12), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(110,140,255,.11), transparent 36%),
        linear-gradient(145deg,var(--bg),var(--bg2));
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding:24px;
    }
    body::before{
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.18;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,black,transparent 85%);
    }
    .shell{
      width:min(920px,100%); position:relative; z-index:1; padding:56px 56px 48px;
      border:1px solid var(--line); border-radius:28px;
      background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.035));
      backdrop-filter:blur(18px);
      box-shadow:0 30px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .topline{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:50px}
    .brand{display:flex;align-items:center;gap:16px}
    .logo{
      width:104px;
      height:104px;
      object-fit:contain;
      display:block;
      border-radius:18px;
      filter:drop-shadow(0 0 22px rgba(87,214,255,.20));
    }
    .brand-name{line-height:1}
    .brand-name strong{display:block;font-size:1.3rem;letter-spacing:.02em}
    .brand-name span{display:block;margin-top:7px;color:var(--muted);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase}
    .status{
      display:inline-flex;align-items:center;gap:8px;padding:9px 13px;
      border:1px solid rgba(87,214,255,.25);border-radius:999px;background:rgba(87,214,255,.07);
      color:#c8f4ff;font-size:.82rem;white-space:nowrap
    }
    .dot{
      width:8px;height:8px;border-radius:50%;background:var(--cyan);
      box-shadow:0 0 14px var(--cyan);animation:pulse 1.8s infinite
    }
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.72)}}
    h1{max-width:760px;margin:0;font-size:clamp(2.8rem,7vw,5.8rem);line-height:.94;letter-spacing:-.055em;font-weight:760}
    .gradient{
      background:linear-gradient(90deg,var(--cyan),#8ab7ff 48%,var(--violet));
      -webkit-background-clip:text;background-clip:text;color:transparent
    }
    .lead{max-width:680px;margin:30px 0 0;font-size:clamp(1rem,2vw,1.22rem);line-height:1.75;color:var(--muted)}
    .lead strong{color:#dbe5f3}
    .rule{height:1px;margin:42px 0 28px;background:linear-gradient(90deg,transparent,var(--line) 14%,var(--line) 86%,transparent)}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:20px;color:#7f8da3;font-size:.82rem}
    .footer strong{color:#bdc8d9;font-weight:600}
    .orbit{
      position:absolute;right:-90px;bottom:-120px;width:340px;height:340px;
      border:1px solid rgba(87,214,255,.12);border-radius:50%;
      box-shadow:0 0 0 38px rgba(110,140,255,.035),0 0 0 78px rgba(155,124,255,.025);pointer-events:none
    }
    .orbit::before,.orbit::after{
      content:"";position:absolute;width:10px;height:10px;border-radius:50%;
      background:var(--cyan);box-shadow:0 0 16px var(--cyan)
    }
    .orbit::before{top:32px;left:66px}
    .orbit::after{right:38px;bottom:78px;background:var(--violet);box-shadow:0 0 16px var(--violet)}
    @media (max-width:680px){
      body{padding:14px}.shell{padding:34px 26px 30px;border-radius:22px}
      .topline{align-items:flex-start;margin-bottom:38px}.status{font-size:.75rem}
      .brand-name span{display:none}.logo{width:84px;height:84px}.footer{align-items:flex-start;flex-direction:column}.orbit{opacity:.55}
    }
    @media (prefers-reduced-motion: reduce){.dot{animation:none}}
  </style>
</head>
